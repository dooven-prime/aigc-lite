[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-lite-external-math-alignment-pilot"
version = "0.1.0.dev0"
description = "Candidate-only source-bound mathematical statement alignment pilot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pypdf==6.7.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aigc_lite_casepacks*"]
namespaces = true

[tool.setuptools.package-data]
"aigc_lite_casepacks.external_math_alignment_v0" = ["source-lock-v0.json", "contract-v0.json"]
