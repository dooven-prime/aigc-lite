[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-lite-ros2"
version = "0.6.0"
description = "ROS 2 physical capability bridge for aigc-lite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.0,<3",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff==0.16.5"]

[project.scripts]
aigc-lite-ros2 = "aigc_lite_ros2.__main__:main"
aigc-lite-ros2-eval = "aigc_lite_ros2.eval_cli:main"
aigc-lite-nav2-graph-eval = "aigc_lite_ros2.nav2_graph_eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aigc_lite_ros2 = ["scenarios/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
