<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aigc-lite workspace</title>
  <style>
    :root { color-scheme: light; --ink:#17212b; --muted:#6c7782; --line:#dfe5e9; --paper:#f6f8f9; --accent:#0d766e; --accent-soft:#e1f2ef; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--paper); font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
    button,input,textarea { font:inherit; } button { cursor:pointer; } .shell { display:grid; grid-template-columns:260px minmax(0,1fr) 300px; min-height:100vh; }
    aside,main { min-width:0; } aside { background:#fff; border-right:1px solid var(--line); padding:24px 18px; } .right { border-left:1px solid var(--line); border-right:0; }
    h1 { font-size:20px; margin:0 0 4px; letter-spacing:0; } h2 { font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:26px 8px 10px; }
    .sub { color:var(--muted); font-size:12px; } .new { width:100%; padding:10px 12px; border:0; border-radius:6px; background:var(--ink); color:#fff; margin:22px 0 14px; }
    .sessions { display:grid; gap:4px; } .sessions button { text-align:left; padding:9px 10px; background:transparent; border:0; border-radius:5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .sessions button.active,.sessions button:hover { background:var(--accent-soft); color:var(--accent); }
    main { display:flex; flex-direction:column; min-height:100vh; } header { border-bottom:1px solid var(--line); background:#fff; padding:20px clamp(18px,4vw,52px); display:flex; justify-content:space-between; align-items:center; } .badge { color:var(--accent); font-size:12px; }
    #messages { flex:1; overflow:auto; padding:30px clamp(18px,8vw,110px); display:grid; align-content:start; gap:18px; } .message { max-width:760px; white-space:pre-wrap; } .message.user { margin-left:auto; background:var(--accent); color:#fff; padding:11px 14px; border-radius:8px 8px 2px 8px; } .message.assistant { padding:4px 0; }
    form.chat { border-top:1px solid var(--line); background:#fff; padding:16px clamp(18px,8vw,110px) 22px; display:flex; gap:10px; } textarea { flex:1; resize:none; min-height:52px; max-height:140px; padding:12px; border:1px solid var(--line); border-radius:6px; outline-color:var(--accent); } .send { width:54px; border:0; border-radius:6px; background:var(--accent); color:#fff; }
    .panel { padding:24px 18px; } label { display:block; font-size:12px; color:var(--muted); margin:18px 0 6px; } input[type=text],input[type=password],input[type=file] { width:100%; padding:9px; background:#fff; border:1px solid var(--line); border-radius:5px; } .action { border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 10px; border-radius:5px; margin-top:10px; } .results { margin-top:18px; display:grid; gap:10px; } .result { font-size:12px; border-top:1px solid var(--line); padding-top:8px; } .result strong { display:block; color:var(--accent); }
    @media (max-width:900px) { .shell { grid-template-columns:210px minmax(0,1fr); } .right { display:none; } } @media (max-width:620px) { .shell { display:block; } aside { display:none; } header { padding:16px; } #messages { padding:22px 16px; } form.chat { padding:12px 16px 16px; } }
  </style>
</head>
<body>
<div class="shell">
  <aside><h1>aigc-lite</h1><div class="sub">Personal and team workspace</div><button class="new" id="new-session">+ New conversation</button><h2>Conversations</h2><div class="sessions" id="sessions"></div></aside>
  <main><header><div><strong id="title">New conversation</strong><div class="sub">OpenAI-compatible agent runtime</div></div><span class="badge">LOCAL</span></header><section id="messages"></section><form class="chat" id="chat-form"><textarea id="prompt" placeholder="Ask anything..." required></textarea><button class="send" aria-label="Send">↑</button></form></main>
  <aside class="right"><div class="panel"><h1>Knowledge</h1><div class="sub">Tenant-scoped workspace documents</div><label for="api-key">Workspace API key</label><input id="api-key" type="password" placeholder="Optional for local mode"><label for="file">Upload text document</label><input id="file" type="file" accept=".txt,.md,.csv,.json"><button class="action" id="upload">Upload document</button><label for="query">Search documents</label><input id="query" type="text" placeholder="Search your workspace"><button class="action" id="search">Search</button><div class="results" id="results"></div></div></aside>
</div>
<script>
const $ = (id) => document.getElementById(id); let sessionId = null;
const savedKey = localStorage.getItem('aigc-lite-api-key') || ''; $('api-key').value=savedKey; $('api-key').oninput=()=>localStorage.setItem('aigc-lite-api-key',$('api-key').value.trim());
async function api(url, options={}) { options.headers={...(options.headers||{})}; const key=$('api-key').value.trim(); if(key) options.headers.Authorization='Bearer '+key; const res = await fetch(url, options); const data = await res.json(); if (!res.ok) throw new Error(data.detail || 'Request failed'); return data; }
async function refreshSessions() { const items = await api('/api/sessions'); $('sessions').innerHTML=''; items.forEach(item => { const button=document.createElement('button'); button.textContent=item.title; button.className=item.id===sessionId?'active':''; button.onclick=()=>loadSession(item.id); $('sessions').append(button); }); }
async function loadSession(id) { const item=await api('/api/sessions/'+id); sessionId=id; $('title').textContent=item.title; $('messages').innerHTML=''; item.messages.forEach(message=>addMessage(message.role,message.content)); await refreshSessions(); }
function addMessage(role, content) { const node=document.createElement('div'); node.className='message '+role; node.textContent=content; $('messages').append(node); $('messages').scrollTop=$('messages').scrollHeight; }
$('new-session').onclick=async()=>{ const item=await api('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})}); await loadSession(item.id); };
$('chat-form').onsubmit=async(event)=>{ event.preventDefault(); const input=$('prompt'); const prompt=input.value.trim(); if(!prompt)return; addMessage('user',prompt); input.value=''; try { const data=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,session_id:sessionId})}); sessionId=data.session_id; addMessage('assistant',data.content); await refreshSessions(); } catch(error) { addMessage('assistant','Error: '+error.message); } };
$('upload').onclick=async()=>{ const file=$('file').files[0]; if(!file)return; const form=new FormData(); form.append('file',file); try { await api('/api/knowledge/upload',{method:'POST',body:form}); $('file').value=''; alert('Uploaded'); } catch(error) { alert(error.message); } };
$('search').onclick=async()=>{ const results=await api('/api/knowledge/search?q='+encodeURIComponent($('query').value)); $('results').replaceChildren(...results.map(item=>{ const node=document.createElement('div'); node.className='result'; const name=document.createElement('strong'); name.textContent=item.name; node.append(name,document.createTextNode(item.content.slice(0,180))); return node; })); };
refreshSessions().then(()=>{ if(!sessionId) $('new-session').click(); }).catch(()=>{});
</script>
</body>
</html>
